<style>
/* Appli mobile une colonne : liste des visites, fiche en 7 étapes repliables, barre de total en bas. Palette ardoise + sable (joint) + terre cuite. */
:root{
  --bg:#f2f4f3; --card:#ffffff; --fg:#1b2428; --muted:#5f6b70; --line:#d8dedc;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111719; --card:#1a2226; --fg:#e7eceb; --muted:#9caaae; --line:#2c383c;
  --blue:#6fa9c2; --blue-soft:#18323d; --orange:#e08f55; --orange-soft:#3a2516; --sand:#3a352d;
  --ok:#55c086; --ok-soft:#163626; --warn:#eba06a; --danger:#ef7064; --danger-soft:#3c1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111719; --card:#1a2226; --fg:#e7eceb; --muted:#9caaae; --line:#2c383c;
  --blue:#6fa9c2; --blue-soft:#18323d; --orange:#e08f55; --orange-soft:#3a2516; --sand:#3a352d;
  --ok:#55c086; --ok-soft:#163626; --warn:#eba06a; --danger:#ef7064; --danger-soft:#3c1c1a; color-scheme:dark}
*{box-sizing:border-box}

img{max-width:100%}[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.top .t{flex:1;min-width:0}.top h1{font-size:22px;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:40px;height:40px;flex:none;padding:3px;background:var(--sand);border-radius:6px}
.mark i{border-radius:2px;background:var(--blue)}.mark i:nth-child(2),.mark i:nth-child(3){background:var(--orange)}
.mark.big{width:76px;height:76px;gap:5px;padding:5px;border-radius:10px}
.save{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.save.busy{background:var(--blue-soft);color:var(--blue)}.save.err{background:var(--danger-soft);color:var(--danger)}
.btn{border:0;border-radius:10px;min-height:46px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--orange);color:#fff}.btn.blue{background:var(--blue);color:#fff}

.btn.danger{background:var(--danger-soft);color:var(--danger)}.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.icon-btn{border:0;background:transparent;min-width:44px;min-height:44px;border-radius:10px;font-size:22px;color:var(--muted)}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 8px;text-align:center}

.bar{display:flex;gap:10px;margin:14px 0}.bar input{flex:1;min-width:0}

.vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%}
.vcard .n{font-weight:700;font-size:17px}.vcard .a{color:var(--muted);font-size:14px;grid-column:1}

.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--blue-soft);color:var(--blue)}
.pill.s-envoye{background:var(--orange-soft);color:var(--warn)}.pill.s-signe{background:var(--ok-soft);color:var(--ok)}.pill.s-perdu{background:var(--danger-soft);color:var(--danger)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}

details.sec>summary::-webkit-details-marker{display:none}
.num{flex:none;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:var(--blue-soft);color:var(--blue)}
.sec.complete .num{background:var(--ok);color:#fff}
summary h2{font-size:21px}summary .hint{font-size:13px;color:var(--muted);font-weight:500}
summary .chev{transition:transform .2s;color:var(--muted)}details[open] summary .chev{transform:rotate(90deg)}
.body{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px}
.panel{padding:14px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=search],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px}

input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;background:var(--card)}

.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}.seg button.no[aria-pressed="true"]{background:var(--muted);color:var(--card)}
.info{display:flex;align-items:center;gap:12px;background:var(--orange-soft);border-radius:10px;padding:12px}
.info b{font-family:var(--display);font-size:30px;color:var(--warn);line-height:1;white-space:nowrap}
.info p{margin:0;font-size:14px}
.note{font-size:13.5px;color:var(--muted);margin:0}

.check:first-child{border-top:0}.check input{width:24px;height:24px;flex:none;accent-color:var(--ok);margin-top:1px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:1fr 64px 88px 40px;gap:6px;align-items:center}
.line input,.room input,.room select{min-height:44px;padding:8px}
.lhead{display:grid;grid-template-columns:1fr 64px 88px 40px;gap:6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.room{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.room .full{grid-column:1 / -1}
.room .dims{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.room .res{grid-column:1 / -1;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.room .res b{color:var(--fg)}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumgrid div{background:var(--sand);border-radius:10px;padding:10px;text-align:center}
.sumgrid small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sumgrid b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.calc{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.calc td{padding:7px 0;border-top:1px solid var(--line)}.calc td:last-child{text-align:right;font-weight:600}
.calc tr.big td{font-size:19px;font-weight:700;border-top:2px solid var(--fg)}.calc tr.acc td{color:var(--warn)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.add-ph{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer}
.add-ph span{font-size:28px;line-height:1}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dock .tot{flex:1;min-width:0}.dock .tot small{display:block;color:var(--muted);font-size:12px}
.dock .tot b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--danger-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}.confirm .r{display:flex;gap:8px;flex-wrap:wrap}
.copybox{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.warnbox{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.row2{grid-template-columns:1fr}.line,.lhead{grid-template-columns:1fr 54px 76px 36px}.sumgrid b{font-size:20px}}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
const MARK=(c="")=>`<span class="mark ${c}" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
const TRAVAUX=["Sol intérieur","Faïence murale","Salle de bain","Douche à l'italienne","Crédence cuisine","Terrasse / extérieur","Escalier","Plinthes","Piscine","Ragréage / chape","Dépose ancien revêtement","Autre"];
const STATUTS=[["a-chiffrer","À chiffrer"],["envoye","Devis envoyé"],["signe","Signé"],["perdu","Perdu"]];
const SUPPORT_SOL=["Dalle béton","Chape","Ancien carrelage","Plancher bois","Parquet / lino à déposer","Terre-plein"];
const SUPPORT_MUR=["Placo standard","Placo hydro (vert)","Plâtre / enduit","Béton / parpaing","Ancien carrelage","Bois / OSB"];
const EXISTANT=[["planeite","Planéité (règle 2 m : écart en mm)"],["niveau","Niveau / faux niveau, pente existante"],["humidite","Humidité, remontées capillaires, salpêtre"],["fissures","Fissures, joints de dilatation, désolidarisation"],["sonne","Ancien carrelage qui sonne creux / se décolle"],["hauteur","Hauteur dispo : seuils, portes à raboter"],["menuiseries","Menuiseries, baignoire, receveur en place"],["plomberie","Sanitaires à déposer / reposer (WC, lavabo…)"],["elec","Prises, interrupteurs à décaler"],["autre","Autre réserve"]];
const POSES=["Droite","Décalée 1/2","Décalée 1/3","Diagonale","Chevron","Bâton rompu","Opus / multi-format"];
const PHOTOS=["Vue générale de chaque pièce","Support (sol et murs)","Seuils et bas de portes","Angles, niches, tablier de baignoire","Accès / stockage / benne","Défauts existants"];
const VALID=[["calepinage","Calepinage validé (sens de pose, point de départ, coupes)"],["joint","Couleur et largeur de joint validées"],["fourni","Qui fournit le carrelage (nous ou le client)"],["depose","Dépose et évacuation des gravats : comprises ou non"],["plomb","Dépose / repose des sanitaires : qui s'en occupe"],["sechage","Temps de séchage expliqué (ragréage, chape, joints)"],["conditions","Conditions : acompte, validité, paiement"],["mention","Mention TVA réduite à faire certifier (10 % ou 5,5 %)"]];
const DEF_SET={entreprise:"DSC Création Carrelage",tauxH:"",tauxJ:"",acompte:"30",chute:"10"};

let assets=null, visits=[], cur=null, view="list", q="", saveState="ok", saveTimer=null, writing=false, pending=false, confirmDel=false, showCopy=false, settings={...DEF_SET};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(Math.round((+n||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const m2=n=>(Math.round((+n||0)*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:0};
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{if(!d)return"";const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const frDate=d=>d?new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
const newRoom=()=>({nom:"",type:"Sol",L:"",l:"",h:"",ded:""});

function blank(){return{date:today(),client:{nom:"",tel:"",email:"",adresse:"",facturation:"",type:"Particulier",occupant:"Propriétaire",payeur:"",origine:""},
acces:{stationnement:false,etage:"",ascenseur:false,code:"",stockage:false,benne:false,contraintes:""},
travaux:[],demande:"",tvaQ:{plus2ans:null,energie:null,neufPro:null,refaitNeuf:null},tvaForce:"",
supportSol:[],supportMur:[],chauffageSol:null,existant:{},
pieces:[newRoom()],plinthes:"",nezMarche:"",seuils:"",profiles:"",photos:[],photosFaites:[],
carrelage:{ref:"",format:"",epaisseur:"",rectifie:null,pose:"Droite",joint:"",couleurJoint:"",fournisseur:"Nous",prixM2:"",m2Boite:"",chute:""},
douche:{dim:"",etancheite:"",evac:"",pente:"",niche:""},
fournitures:[{d:"",q:"",pu:""}],moMode:"h",heures:"",jours:"",
valid:{},budget:"",suivi:{envoye:"",signe:"",intervention:"",commande:""},statut:"a-chiffrer",notes:"",createdAt:Date.now(),updatedAt:Date.now()}}

function surfaces(v){let sol=0,mur=0;for(const p of v.pieces||[]){let s;if(p.type==="Mur")s=num(p.L)*num(p.h)-num(p.ded);else s=num(p.L)*num(p.l)-num(p.ded);s=Math.max(0,s);p.type==="Mur"?mur+=s:sol+=s}
 const chute=v.carrelage.chute!==""?num(v.carrelage.chute):autoChute(v);const total=sol+mur;const cmd=total*(1+chute/100);
 const boites=num(v.carrelage.m2Boite)>0?Math.ceil(cmd/num(v.carrelage.m2Boite)):0;return{sol,mur,total,chute,cmd,boites}}
function autoChute(v){const p=v.carrelage.pose;let c=num(settings.chute)||10;if(["Diagonale","Chevron","Bâton rompu"].includes(p))c=Math.max(c,15);const f=String(v.carrelage.format).match(/(\d+)\s*[x×*]\s*(\d+)/i);if(f&&Math.max(+f[1],+f[2])>=120)c=Math.max(c,15);return c}
function tvaAuto(v){const t=v.tvaQ||{};if(t.neufPro===true||t.refaitNeuf===true)return 20;if(t.plus2ans===true&&t.energie===true)return 5.5;if(t.plus2ans===true)return 10;if(t.plus2ans===false)return 20;return null}
function tvaRate(v){return v.tvaForce!==""&&v.tvaForce!=null?+v.tvaForce:(tvaAuto(v)??10)}
function totals(v){const s=surfaces(v);const carr=v.carrelage.fournisseur==="Nous"?s.cmd*num(v.carrelage.prixM2):0;
 const f=carr+(v.fournitures||[]).reduce((a,l)=>a+num(l.q)*num(l.pu),0);
 const mo=v.moMode==="j"?num(v.jours)*num(settings.tauxJ):num(v.heures)*num(settings.tauxH);
 const ht=f+mo,r=tvaRate(v),tva=ht*r/100,ttc=ht+tva;return{carr,f,mo,ht,r,tva,ttc,acompte:ttc*num(settings.acompte)/100,s}}
function done(v){const s=surfaces(v);return[!!(v.client.nom&&(v.client.tel||v.client.email)&&v.client.adresse),!!(v.travaux.length&&(tvaAuto(v)!=null||v.tvaForce)),(v.supportSol.length||v.supportMur.length)&&Object.values(v.existant).filter(Boolean).length>=2,s.total>0,!!(v.carrelage.format&&v.carrelage.pose),totals(v).ht>0,Object.values(v.valid).filter(Boolean).length>=5]}

/* stockage local */
let idb=null;
function openIDB(){return new Promise((res,rej)=>{if(!("indexedDB" in window))return rej();const r=indexedDB.open("visites-dsc",1);
 r.onupgradeneeded=()=>{const d=r.result;["visites","photos","reglages"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,n==="visites"?{keyPath:"id"}:undefined)})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(store,mode);let out;const r=fn(t.objectStore(store));if(r)r.onsuccess=()=>out=r.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const LS="visites-dsc";
const store={
 async all(){if(idb)return (await tx("visites","readonly",s=>s.getAll()))||[];try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}},
 async put(v){if(idb)return tx("visites","readwrite",s=>s.put(v));const a=await store.all();const i=a.findIndex(x=>x.id===v.id);i<0?a.push(v):a[i]=v;localStorage.setItem(LS,JSON.stringify(a))},
 async del(id){if(idb)return tx("visites","readwrite",s=>s.delete(id));localStorage.setItem(LS,JSON.stringify((await store.all()).filter(x=>x.id!==id)))},
 async putPhoto(id,b){return tx("photos","readwrite",s=>s.put(b,id))},async getPhoto(id){return tx("photos","readonly",s=>s.get(id))},async delPhoto(id){return tx("photos","readwrite",s=>s.delete(id))},
 async getSet(){try{if(idb)return await tx("reglages","readonly",s=>s.get("reglages"));return JSON.parse(localStorage.getItem(LS+"-reglages")||"null")}catch(e){return null}},
 async putSet(v){if(idb)return tx("reglages","readwrite",s=>s.put(v,"reglages"));localStorage.setItem(LS+"-reglages",JSON.stringify(v))}};
const photoURL=new Map();

 p("Client",v.client.nom);p("Téléphone",v.client.tel);p("E-mail",v.client.email);p("Chantier",v.client.adresse);p("Facturation",v.client.facturation);p("Type",v.client.type+" · "+v.client.occupant);p("Payeur",v.client.payeur);
 L.push("");p("Travaux",v.travaux);p("Demande",v.demande);p("TVA",String(t.r).replace(".",",")+" %");
 L.push("");L.push("SUPPORTS ET EXISTANT");p("Sol",v.supportSol);p("Murs",v.supportMur);if(v.chauffageSol!=null)p("Chauffage au sol",v.chauffageSol?"oui":"non");EXISTANT.filter(([k])=>v.existant[k]).forEach(([k,l])=>L.push("- "+l+" : "+v.existant[k]));
 L.push("");L.push("SURFACES");v.pieces.filter(x=>num(x.L)).forEach(x=>{const m=x.type==="Mur";const a=Math.max(0,m?num(x.L)*num(x.h)-num(x.ded):num(x.L)*num(x.l)-num(x.ded));L.push("- "+(x.nom||"Pièce")+" ("+x.type.toLowerCase()+") : "+m2(a)+" m²")});
 L.push("Total sol "+m2(s.sol)+" m² · murs "+m2(s.mur)+" m² · à commander "+m2(s.cmd)+" m² ("+m2(s.chute)+" % de chute)"+(s.boites?" · "+s.boites+" boîtes":""));
 p("Plinthes (ml)",v.plinthes);p("Profilés (ml)",v.profiles);p("Nez de marche",v.nezMarche);p("Seuils",v.seuils);
 const c=v.carrelage;L.push("");L.push("CARRELAGE");p("Modèle",c.ref);p("Format",c.format);p("Épaisseur (mm)",c.epaisseur);if(c.rectifie!=null)p("Rectifié",c.rectifie?"oui":"non");p("Pose",c.pose);p("Joint",[c.joint&&c.joint+" mm",c.couleurJoint].filter(Boolean).join(", "));p("Fourni par",c.fournisseur);
 if(v.travaux.includes("Douche à l'italienne")){L.push("");L.push("DOUCHE À L'ITALIENNE");p("Dimensions",v.douche.dim);p("Étanchéité",v.douche.etancheite);p("Évacuation",v.douche.evac);p("Pente",v.douche.pente);p("Équipements",v.douche.niche)}
 const fl=v.fournitures.filter(l=>l.d||num(l.pu));L.push("");L.push("CHIFFRAGE");if(t.carr)L.push("- Carrelage "+m2(s.cmd)+" m² × "+eur(num(c.prixM2))+" = "+eur(t.carr)+" HT");fl.forEach(l=>L.push("- "+(l.d||"?")+" × "+(l.q||1)+" à "+eur(num(l.pu))+" HT"));
 L.push(v.moMode==="j"?"Main d'œuvre : "+num(v.jours)+" j × "+eur(num(settings.tauxJ))+" = "+eur(t.mo)+" HT":"Main d'œuvre : "+num(v.heures)+" h × "+eur(num(settings.tauxH))+" = "+eur(t.mo)+" HT");
 L.push("Total HT : "+eur(t.ht));L.push("TVA "+String(t.r).replace(".",",")+" % : "+eur(t.tva));L.push("Total TTC : "+eur(t.ttc));L.push("Acompte "+m2(num(settings.acompte))+" % : "+eur(t.acompte));
 if(v.notes){L.push("");p("Notes",v.notes)}return L.join("\n")}

/* ---------- commande fournisseur ---------- */
const toOrder=()=>visits.filter(v=>v.statut==="signe"&&!(v.suivi&&v.suivi.commande));
function supplierList(v){const L=[];L.push("COMMANDE — "+(v.client?.nom||"Client")+(v.client?.adresse?" — "+v.client.adresse:""));
 if(v.suivi?.intervention)L.push("Pour le chantier du "+frDate(v.suivi.intervention));
 const s=surfaces(v),c=v.carrelage||{};let n=0;
 if(c.fournisseur==="Nous"&&s.cmd>0){n++;L.push("- Carrelage "+[c.ref,c.format&&c.format+" cm",c.epaisseur&&c.epaisseur+" mm",c.rectifie?"rectifié":""].filter(Boolean).join(", ")+" : "+m2(s.cmd)+" m²"+(s.boites?" ("+s.boites+" boîtes)":"")+" — chute "+m2(s.chute)+" % comprise")}
 if(num(v.plinthes)){n++;L.push("- Plinthes assorties : "+m2(num(v.plinthes))+" ml (prévoir 10 % en plus)")}
 if(num(v.profiles)){n++;L.push("- Profilés / baguettes d'angle : "+m2(num(v.profiles))+" ml")}
 if(num(v.nezMarche)){n++;L.push("- Nez de marche : "+num(v.nezMarche))}
 if(num(v.seuils)){n++;L.push("- Seuils / barres de seuil : "+num(v.seuils))}
 if(c.couleurJoint)L.push("  (joint couleur : "+c.couleurJoint+(c.joint?", "+c.joint+" mm":"")+")");
 (v.fournitures||[]).filter(l=>(l.d||"").trim()).forEach(l=>{n++;L.push("- "+(num(l.q)||1)+" × "+l.d.trim())});
 if(!n)L.push("(aucun matériel saisi dans la fiche)");
 if(c.fournisseur==="Le client")L.push("Carrelage fourni par le client"+(s.cmd>0?" : lui dire d'acheter "+m2(s.cmd)+" m²"+(s.boites?" ("+s.boites+" boîtes)":""):""));
 return L.join("\n")}
function orderBlock(v){return `<div class="f" style="border:2px solid var(--blue);border-radius:10px;padding:12px;gap:10px"><span class="lbl" style="color:var(--blue)">Commande fournisseur</span>
 <pre style="margin:0;white-space:pre-wrap;font-family:inherit;font-size:15px">${esc(supplierList(v))}</pre>
 <div class="bar" style="margin:0;flex-wrap:wrap"><button type="button" class="btn blue sm" data-act="copyorder">Copier la liste</button>${navigator.share?`<button type="button" class="btn ghost sm" data-act="shareorder">Envoyer au fournisseur</button>`:""}</div>
 ${inp("suivi.commande","Commandé le",v.suivi.commande,"date")}</div>`}
function renderOrders(){const list=toOrder();
 return `<div class="top"><button class="icon-btn" data-act="tolist" aria-label="Retour aux visites">‹</button><div class="t"><h1>Commandes à passer</h1><div class="sub">${list.length} chantier${list.length>1?"s":""} signé${list.length>1?"s":""}, matériel pas encore commandé</div></div></div>
 ${list.length?`<button class="btn blue" style="width:100%;margin-bottom:12px" data-act="copyall">Copier toutes les commandes</button>`:""}
 <div class="cards">${list.length?list.map(v=>`<div class="vcard" style="display:flex;flex-direction:column;gap:10px">
 <pre style="margin:0;white-space:pre-wrap;font-family:inherit;font-size:15px">${esc(supplierList(v))}</pre>
 <div class="bar" style="margin:0;flex-wrap:wrap"><button class="btn ghost sm" data-copyorder="${esc(v.id)}">Copier</button><button class="btn primary sm" data-ordered="${esc(v.id)}">Marquer commandé</button></div></div>`).join("")
 :`<div class="empty"><b>Tout est commandé</b>Quand un devis passe en « Signé », sa liste de matériel arrive ici.</div>`}</div>`}
async function copyText(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok)}catch(_){toast("Copie refusée : ouvre la fiche et sélectionne le texte")}}
function render(){const app=$("#app");if(view==="orders"){app.innerHTML=renderOrders();$("#dock").hidden=true;return}if(view==="list"){app.innerHTML=renderList();$("#dock").hidden=true}else if(view==="settings"){app.innerHTML=renderSettings();$("#dock").hidden=true}else{app.innerHTML=renderForm();setSave(saveState);paintDock();hydratePhotos()}}
function paintDock(){const d=$("#dock");if(view!=="form"||!cur){d.hidden=true;return}const t=totals(cur);d.hidden=false;
 d.innerHTML=`<div class="in"><div class="tot"><small>${m2(t.s.total)} m² · TVA ${String(t.r).replace(".",",")} % · acompte ${eur(t.acompte)}</small><b>${eur(t.ttc)}</b></div><button class="btn primary" data-act="back">Terminer</button></div>`;
 const c=$("#calc");if(c)c.innerHTML=calcRows(t);const sf=$("#surf");if(sf)sf.innerHTML=surfHTML(cur);
 cur.pieces.forEach((p,i)=>{const r=document.querySelector(`[data-res="${i}"] b`);if(r){const m=p.type==="Mur";r.textContent=m2(Math.max(0,m?num(p.L)*num(p.h)-num(p.ded):num(p.L)*num(p.l)-num(p.ded)))+" m²"}});
 const st=$("#steps");if(st)st.innerHTML=done(cur).map(x=>`<span class="${x?"done":""}"></span>`).join("")}
function setPath(o,path,val){const ks=path.split(".");let x=o;for(let i=0;i<ks.length-1;i++){x[ks[i]]=x[ks[i]]||{};x=x[ks[i]]}x[ks.at(-1)]=val}
function getPath(o,path){return path.split(".").reduce((x,k)=>x?.[k],o)}
function rerenderKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y)}
let setTimer=null;
document.addEventListener("input",e=>{const el=e.target;
 if(el.id==="q"){q=el.value;const pos=el.selectionStart;render();const n=$("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}return}
 if(el.dataset.set){settings[el.dataset.set]=el.value;clearTimeout(setTimer);setTimer=setTimeout(()=>store.putSet(settings).catch(()=>toast("Réglages non enregistrés")),400);return}
 if(!cur)return;
 if(el.dataset.k&&el.type!=="checkbox"){setPath(cur,el.dataset.k,el.value);schedule();
  if(el.dataset.k==="client.nom")$(".top h1").textContent=el.value||"Nouvelle visite";
  if(el.dataset.k==="client.adresse")$(".top .sub").textContent=el.value||frDate(cur.date);
  if(["suivi.envoye","tvaForce"].includes(el.dataset.k))rerenderKeepScroll()}
 if(el.dataset.line!=null){cur.fournitures[+el.dataset.line][el.dataset.f]=el.value;schedule()}
 if(el.dataset.room!=null&&el.tagName==="INPUT"){cur.pieces[+el.dataset.room][el.dataset.f]=el.value;schedule()}});
document.addEventListener("change",e=>{const el=e.target;
 if(el.id==="imp"&&el.files[0]){importAll(el.files[0]);return}
 if(!cur)return;
 if(el.type==="checkbox"&&el.dataset.k){setPath(cur,el.dataset.k,el.checked);schedule()}
 if(el.type==="checkbox"&&el.dataset.multiCb){const a=cur[el.dataset.multiCb];const i=a.indexOf(el.value);if(el.checked&&i<0)a.push(el.value);if(!el.checked&&i>=0)a.splice(i,1);schedule()}
 if(el.tagName==="SELECT"&&el.dataset.k){setPath(cur,el.dataset.k,el.value);schedule();rerenderKeepScroll()}
 if(el.tagName==="SELECT"&&el.dataset.room!=null){cur.pieces[+el.dataset.room].type=el.value;schedule();rerenderKeepScroll()}
 if(el.id==="phin")upload(el.files)});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset?.sec){d.open?openSecs.add(d.dataset.sec):openSecs.delete(d.dataset.sec)}},true);
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act;
 if(a==="settings"){view="settings";render();window.scrollTo(0,0);return}
 if(a==="tolist"){clearTimeout(setTimer);try{await store.putSet(settings)}catch(_){}view="list";render();window.scrollTo(0,0);return}
 if(b.dataset.open){cur=structuredClone(visits.find(x=>x.id===b.dataset.open));if(!cur)return;normalize(cur);view="form";openSecs=new Set(["1"]);confirmDel=false;showCopy=false;saveState="ok";render();window.scrollTo(0,0);return}
 if(a==="new"){cur={id:"v"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...blank()};view="form";openSecs=new Set(["1"]);confirmDel=false;showCopy=false;await flush();render();window.scrollTo(0,0);return}
 if(a==="orders"){view="orders";render();window.scrollTo(0,0);return}
 if(a==="tolist"&&view==="orders"){view="list";render();window.scrollTo(0,0);return}
 if(a==="copyall"){await copyText(toOrder().map(supplierList).join("\n\n"),"Toutes les commandes copiées");return}
 if(b.dataset.copyorder){const v=visits.find(x=>x.id===b.dataset.copyorder);if(v)await copyText(supplierList(v),"Commande copiée");return}
 if(b.dataset.ordered){const v=visits.find(x=>x.id===b.dataset.ordered);if(!v)return;cur=structuredClone(v);normalize(cur);cur.suivi.commande=today();cur.updatedAt=Date.now();await flush();cur=null;toast("Marqué comme commandé");render();return}
 if(a==="back"){clearTimeout(saveTimer);if(pending)await flush();cur=null;view="list";render();window.scrollTo(0,0);return}
 if(a==="export"){await exportAll();return}
 if(!cur)return;
 if(b.dataset.pick){let k=b.dataset.pick,v=b.dataset.v;if(k==="moMode")v=v==="À la journée"?"j":"h";if(k==="statut"){v=(STATUTS.find(s=>s[1]===v)||STATUTS[0])[0];if(v==="signe"&&!cur.suivi.signe)cur.suivi.signe=today()}setPath(cur,k,v);schedule();rerenderKeepScroll();return}
 if(b.dataset.yn){const k=b.dataset.yn,v=b.dataset.v==="1";setPath(cur,k,getPath(cur,k)===v?null:v);schedule();rerenderKeepScroll();return}
 if(b.dataset.multi){const arr=cur[b.dataset.multi],v=b.dataset.v,i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);schedule();rerenderKeepScroll();return}
 if(a==="addline"){cur.fournitures.push({d:"",q:"",pu:""});schedule();rerenderKeepScroll();const ins=document.querySelectorAll('[data-f="d"][data-line]');ins[ins.length-1]?.focus();return}
 if(a==="suggest"){const s=surfaces(cur);const big=/(\d+)\s*[x×*]\s*(\d+)/i.exec(cur.carrelage.format);const grand=big&&Math.max(+big[1],+big[2])>=60;
  const add=[{d:"Colle "+(grand?"C2 S1 (grand format, double encollage)":"C2"),q:String(Math.ceil(s.total*(grand?7:5)/25)),pu:""},{d:"Joint "+(cur.carrelage.couleurJoint||"")+" (sac 5 kg)",q:String(Math.max(1,Math.ceil(s.total/15))),pu:""},{d:"Primaire d'accrochage",q:"1",pu:""}];
  if(cur.travaux.includes("Douche à l'italienne"))add.push({d:"Kit étanchéité SPEC / natte + bandes",q:"1",pu:""});
  cur.fournitures=cur.fournitures.filter(l=>l.d||l.pu).concat(add);schedule();rerenderKeepScroll();toast("Quantités indicatives : vérifie selon tes produits");return}
 if(b.dataset.rmline!=null){cur.fournitures.splice(+b.dataset.rmline,1);if(!cur.fournitures.length)cur.fournitures.push({d:"",q:"",pu:""});schedule();rerenderKeepScroll();return}
 if(a==="addroom"){cur.pieces.push(newRoom());schedule();rerenderKeepScroll();const ins=document.querySelectorAll('[data-room][data-f="nom"]');ins[ins.length-1]?.focus();return}
 if(b.dataset.rmroom!=null){cur.pieces.splice(+b.dataset.rmroom,1);if(!cur.pieces.length)cur.pieces.push(newRoom());schedule();rerenderKeepScroll();return}
 if(b.dataset.delph){const pid=b.dataset.delph;cur.photos=cur.photos.filter(x=>x!==pid);store.delPhoto(pid).catch(()=>{});schedule();rerenderKeepScroll();return}
 if(a==="copy"){const txt=summary(cur);try{await navigator.clipboard.writeText(txt);toast("Résumé copié : colle-le dans Henrri");showCopy=false}catch(_){showCopy=true}rerenderKeepScroll();if(showCopy){const c=$("#copybox");c?.focus();c?.select()}return}
 if(a==="share"){try{await navigator.share({title:"Visite "+(cur.client.nom||""),text:summary(cur)})}catch(_){}return}
 if(a==="copyorder"){await copyText(supplierList(cur),"Commande copiée");return}
 if(a==="shareorder"){try{await navigator.share({title:"Commande "+(cur.client.nom||""),text:supplierList(cur)})}catch(_){}return}
 if(a==="del"){confirmDel=true;rerenderKeepScroll();return}
 if(a==="del-no"){confirmDel=false;rerenderKeepScroll();return}
 if(a==="del-yes"){clearTimeout(saveTimer);pending=false;const v=cur;try{await store.del(v.id);for(const p of v.photos||[])await store.delPhoto(p).catch(()=>{});visits=visits.filter(x=>x.id!==v.id);toast("Visite supprimée")}catch(_){toast("Suppression impossible, réessaie.")}cur=null;view="list";render();return}
});
function normalize(v){const b=blank();for(const k in b){if(v[k]==null)v[k]=b[k];else if(typeof b[k]==="object"&&!Array.isArray(b[k]))v[k]={...b[k],...v[k]}}if(!v.fournitures?.length)v.fournitures=[{d:"",q:"",pu:""}];if(!v.pieces?.length)v.pieces=[newRoom()]}
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{const M=1400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.75)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function upload(files){if(!assets||!files?.length)return;setSave("busy");
 for(const f of files){try{const b=await compress(f);const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await store.putPhoto(id,b);cur.photos.push(id)}catch(e){toast("Photo non enregistrée : format non lu ou mémoire pleine.")}}
 schedule();rerenderKeepScroll()}
const toDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function exportAll(){const photos={};for(const v of visits)for(const p of v.photos||[]){try{const b=await store.getPhoto(p);if(b)photos[p]=await toDataURL(b)}catch(e){}}
 const blob=new Blob([JSON.stringify({app:"visites-dsc",version:1,date:new Date().toISOString(),reglages:settings,visites:visits,photos})],{type:"application/json"});const name="sauvegarde-visites-dsc-"+today()+".json";
 const file=new File([blob],name,{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Sauvegarde téléchargée")}
async function importAll(file){try{const d=JSON.parse(await file.text());if(d.app!=="visites-dsc"||!Array.isArray(d.visites))throw 0;
 for(const [id,url] of Object.entries(d.photos||{})){const b=await (await fetch(url)).blob();await store.putPhoto(id,b)}
 let n=0;for(const v of d.visites){const ex=visits.find(x=>x.id===v.id);if(!ex||(v.updatedAt||0)>(ex.updatedAt||0)){await store.put(v);n++}}
 if(d.reglages&&!num(settings.tauxH)&&!num(settings.tauxJ)){settings={...settings,...d.reglages};await store.putSet(settings)}
 visits=await store.all();sortV();view="list";render();toast(n+" fiche(s) restaurée(s)")}catch(e){toast("Ce fichier n'est pas une sauvegarde des visites.")}}
init();
</script>
